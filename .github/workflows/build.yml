name: Build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Clone and patch LobeChat
        run: |
          git clone --depth 1 https://github.com/lobehub/lobe-chat.git /tmp/lobe-chat
          cd /tmp/lobe-chat
          # Add Clerk build arg
          sed -i 's/ARG NEXT_PUBLIC_ANALYTICS_POSTHOG/ARG NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY\nARG NEXT_PUBLIC_ANALYTICS_POSTHOG/' Dockerfile
          sed -i 's|ENV NEXT_PUBLIC_BASE_PATH|ENV NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" \\\n    NEXT_PUBLIC_BASE_PATH|' Dockerfile
          # Install git in base image (needed for prepare scripts)
          sed -i 's/apt install ca-certificates proxychains-ng -qy/apt install ca-certificates proxychains-ng git -qy/' Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: /tmp/lobe-chat
          file: /tmp/lobe-chat/Dockerfile
          push: true
          tags: ghcr.io/9214919/lobe-chat-clerk:latest
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ENABLE_NEXT_AUTH=0
