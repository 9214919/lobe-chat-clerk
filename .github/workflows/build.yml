name: Build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Clone LobeChat
        run: git clone --depth 1 https://github.com/lobehub/lobe-chat.git /tmp/lobe-chat
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: /tmp/lobe-chat
          file: /tmp/lobe-chat/Dockerfile
          push: true
          tags: ghcr.io/9214919/lobe-chat-clerk:latest
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ENABLE_NEXT_AUTH=0
